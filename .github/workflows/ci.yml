name: CI/CD

# Minimal permissions at workflow level — jobs that need more declare it explicitly.
# This prevents a compromised step from writing to the repo or calling APIs it
# shouldn't touch.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION:          us-east-1
  ECR_REPOSITORY:      drrgt-api
  ECS_CLUSTER:         drrgt-cluster
  ECS_SERVICE_API:     drrgt-api
  ECS_SERVICE_WORKER:  drrgt-worker
  TASK_FAMILY_API:     drrgt-api
  TASK_FAMILY_WORKER:  drrgt-worker
  CONTAINER_NAME:      api

jobs:
  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to SHA rather than mutable tag so a compromised upstream release
      # (e.g. actions/checkout@v4 being hijacked) can't silently inject code.
      # Update pins periodically with Dependabot or manual review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b    # v5.3.0
        with: { python-version: "3.12" }

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///./test_drrgt.db"
          USE_SAMPLE_DATA_FALLBACK: "true"
        run: pytest -q --tb=short

  # ── Frontend build check ─────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af      # v4.1.0
        with: { node-version: "20" }

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

  # ── Build + push image + deploy to ECS ───────────────────────────────────
  # Runs only on main branch pushes, only if both test jobs pass.
  # Strategy:
  #   1. Build image tagged with the commit SHA (immutable tag = traceable).
  #   2. Push to ECR.
  #   3. For each service (API, Worker):
  #      a. Fetch current task definition.
  #      b. Strip read-only ECS fields.
  #      c. Swap the container image to the new SHA.
  #      d. Register as a new task definition revision.
  #      e. Update the ECS service to use that revision.
  #   4. Wait for the API service to stabilise (health check gate).

  deploy:
    needs: [test, frontend-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy needs to write to ECR and update ECS — declare explicitly.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b19f1513f52c2e74bfd30f79f11e9caba3bde    # v2.0.1

      # ── Build and push ──────────────────────────────────────────────────
      - name: Build and push Docker image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ── Deploy API service ──────────────────────────────────────────────
      - name: Deploy API service
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ env.TASK_FAMILY_API }}" \
            --query "taskDefinition" \
            --output json \
          | python3 - <<'PYEOF'
          import json, sys
          td = json.load(sys.stdin)
          for key in [
            "taskDefinitionArn", "revision", "status", "requiresAttributes",
            "placementConstraints", "compatibilities", "registeredAt", "registeredBy",
          ]:
              td.pop(key, None)
          for c in td["containerDefinitions"]:
              if c["name"] == "api":
                  import os
                  c["image"] = os.environ["IMAGE"]
          print(json.dumps(td))
          PYEOF
          )

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "Registered task definition: $NEW_ARN"

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service  "${{ env.ECS_SERVICE_API }}" \
            --task-definition "$NEW_ARN"

          echo "Waiting for API service to stabilise..."
          aws ecs wait services-stable \
            --cluster  "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE_API }}"
          echo "API deployment complete: $NEW_ARN"

      # ── Deploy Worker service ───────────────────────────────────────────
      - name: Deploy Worker service
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ env.TASK_FAMILY_WORKER }}" \
            --query "taskDefinition" \
            --output json \
          | python3 - <<'PYEOF'
          import json, sys, os
          td = json.load(sys.stdin)
          for key in [
            "taskDefinitionArn", "revision", "status", "requiresAttributes",
            "placementConstraints", "compatibilities", "registeredAt", "registeredBy",
          ]:
              td.pop(key, None)
          for c in td["containerDefinitions"]:
              if c["name"] == "worker":
                  c["image"] = os.environ["IMAGE"]
          print(json.dumps(td))
          PYEOF
          )

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service  "${{ env.ECS_SERVICE_WORKER }}" \
            --task-definition "$NEW_ARN"

          echo "Worker updated: $NEW_ARN"
